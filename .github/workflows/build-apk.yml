name: APK Derle (Kur'an Yolculuğu)

on:
  push:
    branches:
      - claude/quran-learning-kids-app-bfho5c
      - main
    paths:
      - "kuran-yolculugu/**"
      - "mobile/**"
      - ".github/workflows/build-apk.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 21 kur
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Node 20 kur
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Android SDK kur
        uses: android-actions/setup-android@v3
        with:
          # Emülatörü kurma (paketi bazen bozuk inip derlemeyi düşürüyor); APK için gerekmez
          packages: "platform-tools"

      - name: Web uygulamasını www içine kopyala
        run: |
          mkdir -p mobile/www
          cp -r kuran-yolculugu/* mobile/www/

      - name: Tilavet seslerini indir (APK'ya offline göm)
        continue-on-error: true
        run: |
          OUT=mobile/www/audio/sure
          mkdir -p "$OUT"
          BASE="https://everyayah.com/data/Husary_128kbps"
          # sure_no:ayet_sayisi  (Fâtiha, İhlâs, Felak, Nâs, Asr, Kevser, Kadir, Fîl, Kureyş, Kâfirûn, Nasr)
          for pair in 1:7 112:4 113:5 114:6 103:3 108:3 97:5 105:5 106:4 109:6 110:3; do
            sure="${pair%%:*}"; adet="${pair##*:}"
            ss=$(printf "%03d" "$sure")
            for a in $(seq 1 "$adet"); do
              aa=$(printf "%03d" "$a")
              curl -fsSL --retry 3 --retry-delay 2 -o "$OUT/$ss$aa.mp3" "$BASE/$ss$aa.mp3" \
                || echo "ATLANDI: $ss$aa"
            done
          done
          echo "İndirilen ses sayısı: $(ls -1 "$OUT" 2>/dev/null | wc -l)"
          ls -lh "$OUT" || true

      - name: Capacitor bağımlılıklarını yükle
        working-directory: mobile
        run: npm install

      - name: Android projesini üret
        working-directory: mobile
        run: |
          npx cap add android
          npx cap sync android

      - name: Uygulama ikonu & açılış ekranı (best-effort)
        continue-on-error: true
        working-directory: mobile
        run: |
          sudo apt-get update && sudo apt-get install -y librsvg2-bin
          rsvg-convert -w 1024 -h 1024 assets/icon.svg -o assets/icon-only.png
          cp assets/icon-only.png assets/icon.png
          rsvg-convert -w 1024 -h 1024 assets/icon.svg -o assets/icon-foreground.png
          rsvg-convert -w 1024 -h 1024 assets/bg.svg -o assets/icon-background.png
          rsvg-convert -w 2732 -h 2732 assets/splash.svg -o assets/splash.png
          cp assets/splash.png assets/splash-dark.png
          npx --yes @capacitor/assets generate --android
          npx cap sync android

      - name: APK derle (debug)
        working-directory: mobile/android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon

      - name: APK'yı yeniden adlandır
        run: |
          mkdir -p dist
          cp mobile/android/app/build/outputs/apk/debug/app-debug.apk \
             dist/KuranYolculugu.apk
          ls -lh dist

      - name: APK'yı artifact olarak yükle
        uses: actions/upload-artifact@v4
        with:
          name: KuranYolculugu-APK
          path: dist/KuranYolculugu.apk
          if-no-files-found: error

      - name: Release oluştur ve APK'yı ekle
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-v${{ github.run_number }}
          name: Kur'an Yolculuğu APK v${{ github.run_number }}
          body: |
            Çocuklar için Elif-Ba öğrenme uygulaması — Android APK (debug imzalı).

            Kurulum: APK'yı indir, "bilinmeyen kaynaklara izin ver" deyip yükle.
          files: dist/KuranYolculugu.apk
          fail_on_unmatched_files: true
