<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Kur'an Yolculuğu 🕌 - Çocuklar için Elif-Ba</title>
  <meta name="description" content="Çocuklara Kuran okumayı (Elif-Ba) harita üzerinde eğlenceli şekilde öğreten oyun." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Amiri:wght@700&display=swap" rel="stylesheet" />
  <style>
/* Kur'an Yolculuğu - Stil */
* { margin: 0; padding: 0; box-sizing: border-box; }

:root {
  --gok: #7dd3fc;
  --gok2: #38bdf8;
  --yesil: #4ade80;
  --sari: #fbbf24;
  --mor: #a78bfa;
  --koyu: #1e3a5f;
}

body {
  font-family: "Baloo 2", "Segoe UI", sans-serif;
  background: linear-gradient(180deg, #bae6fd 0%, #ddd6fe 100%);
  min-height: 100vh;
  color: var(--koyu);
  overflow-x: hidden;
  -webkit-tap-highlight-color: transparent;
}

#app { max-width: 540px; margin: 0 auto; padding: 0 0 60px; }

.arabic, .harf-buyuk, .soru-harf, .durak-emoji { font-family: "Amiri", serif; }

/* ---- Üst çubuk ---- */
.topbar {
  display: flex; justify-content: space-between; align-items: center;
  padding: 16px 20px; position: sticky; top: 0; z-index: 10;
  background: linear-gradient(90deg, var(--gok2), var(--mor));
  color: #fff; box-shadow: 0 4px 14px rgba(0,0,0,.15);
  border-radius: 0 0 22px 22px;
}
.logo { font-weight: 800; font-size: 1.25rem; }
.yildiz-sayac {
  background: rgba(255,255,255,.25); padding: 6px 14px; border-radius: 20px;
  font-weight: 700; font-size: 1.1rem;
}
.intro { text-align: center; padding: 14px 20px 4px; font-weight: 600; color: #334155; }

/* ---- Harita / yol ---- */
.yol { display: flex; flex-direction: column; align-items: center; padding: 10px 16px; gap: 6px; }
.bolge-baslik {
  align-self: stretch; text-align: center; color: #fff; font-weight: 800;
  padding: 10px; border-radius: 16px; margin: 18px 0 6px;
  font-size: 1.05rem; box-shadow: 0 3px 8px rgba(0,0,0,.12);
}

.durak {
  position: relative; width: 150px; min-height: 96px;
  border: none; border-radius: 22px; cursor: pointer;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: 2px; padding: 12px; font-family: inherit;
  box-shadow: 0 6px 0 rgba(0,0,0,.18); transition: transform .12s, box-shadow .12s;
}
.durak.sol { align-self: flex-start; margin-left: 8%; }
.durak.sag { align-self: flex-end; margin-right: 8%; }
.durak:not(:disabled):active { transform: translateY(4px); box-shadow: 0 2px 0 rgba(0,0,0,.18); }

.durak.acik  { background: #fff; }
.durak.tamam { background: linear-gradient(135deg, #fde68a, #fbbf24); }
.durak.kilitli { background: #cbd5e1; color: #64748b; cursor: not-allowed; box-shadow: 0 6px 0 #94a3b8; }

.durak-emoji { font-size: 2rem; line-height: 1; }
.durak-isim { font-weight: 700; font-size: .9rem; text-align: center; }
.durak-yildiz { font-size: .8rem; letter-spacing: 1px; }

/* yol arası bağlantı noktaları */
.durak::after {
  content: ""; position: absolute; bottom: -10px; width: 4px; height: 10px;
  background: repeating-linear-gradient(#fff 0 4px, transparent 4px 8px);
}

.reset-btn {
  display: block; margin: 30px auto 0; background: rgba(255,255,255,.7);
  border: 2px solid #cbd5e1; color: #64748b; padding: 8px 18px;
  border-radius: 16px; font-family: inherit; font-weight: 700; cursor: pointer;
}

/* ---- Ders ekranı ---- */
.ders-wrap, .test-wrap { padding: 16px; }
.ders-ust { display: flex; align-items: center; gap: 12px; margin-bottom: 18px; }
.ders-ust h2 { font-size: 1.2rem; }
.geri {
  background: #fff; border: none; padding: 8px 14px; border-radius: 14px;
  font-family: inherit; font-weight: 700; cursor: pointer; box-shadow: 0 3px 0 #cbd5e1;
}

.kart-alan { display: flex; justify-content: center; margin-bottom: 20px; }
.flashcard {
  background: #fff; border-radius: 28px; padding: 30px 24px; width: 100%;
  text-align: center; box-shadow: 0 10px 30px rgba(0,0,0,.15);
  animation: pop .3s ease;
}
@keyframes pop { from { transform: scale(.8); opacity: 0; } to { transform: scale(1); opacity: 1; } }
.harf-buyuk { font-size: 6rem; color: var(--gok2); line-height: 1.1; }
.harf-ad { font-size: 2rem; font-weight: 800; margin-top: 8px; color: var(--koyu); }
.harf-ipucu { color: #64748b; margin-top: 10px; font-weight: 600; }
.dinle {
  margin-top: 18px; background: var(--yesil); color: #fff; border: none;
  padding: 12px 26px; border-radius: 18px; font-family: inherit; font-weight: 800;
  font-size: 1.1rem; cursor: pointer; box-shadow: 0 5px 0 #16a34a;
}
.dinle:active { transform: translateY(3px); box-shadow: 0 2px 0 #16a34a; }

.kart-nav { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.kart-nav button {
  background: var(--mor); color: #fff; border: none; padding: 12px 18px;
  border-radius: 16px; font-family: inherit; font-weight: 800; cursor: pointer;
  box-shadow: 0 5px 0 #7c3aed; font-size: 1rem;
}
.kart-nav button:disabled { background: #cbd5e1; box-shadow: 0 5px 0 #94a3b8; }
.kart-nav .sonraki { background: var(--yesil); box-shadow: 0 5px 0 #16a34a; }
.kart-sayac { font-weight: 800; color: #475569; }

/* ---- Test ekranı ---- */
.test-ust { display: flex; align-items: center; gap: 10px; margin-bottom: 20px; font-weight: 800; }
.ilerleme-cubuk { flex: 1; height: 14px; background: #e2e8f0; border-radius: 10px; overflow: hidden; }
.ilerleme-cubuk div { height: 100%; background: linear-gradient(90deg, var(--yesil), var(--gok2)); transition: width .3s; }

.soru {
  background: #fff; border-radius: 24px; padding: 26px 20px; text-align: center;
  margin-bottom: 18px; box-shadow: 0 8px 24px rgba(0,0,0,.12);
}
.soru-harf { font-size: 5rem; color: var(--gok2); margin-bottom: 8px; }
.soru p { font-size: 1.3rem; font-weight: 700; }

.secenekler { display: grid; gap: 12px; }
.secenek {
  background: #fff; border: 3px solid #e2e8f0; padding: 16px; border-radius: 18px;
  font-family: inherit; font-weight: 800; font-size: 1.25rem; cursor: pointer;
  color: var(--koyu); transition: transform .1s;
}
.secenek:not(:disabled):active { transform: scale(.97); }
.secenek.dogru { background: #dcfce7; border-color: var(--yesil); color: #166534; }
.secenek.yanlis { background: #fee2e2; border-color: #f87171; color: #991b1b; }

.geri-bildirim { text-align: center; margin-top: 16px; min-height: 50px; }
.geri-bildirim .iyi { color: #16a34a; font-weight: 800; font-size: 1.2rem; }
.geri-bildirim .kotu { color: #b91c1c; font-weight: 700; }
.devam {
  display: block; margin: 14px auto 0; background: var(--gok2); color: #fff; border: none;
  padding: 14px 30px; border-radius: 18px; font-family: inherit; font-weight: 800;
  font-size: 1.15rem; cursor: pointer; box-shadow: 0 5px 0 #0284c7;
}

/* ---- Sonuç ---- */
.sonuc { background: #fff; border-radius: 28px; padding: 36px 24px; text-align: center; box-shadow: 0 12px 36px rgba(0,0,0,.18); animation: pop .35s ease; }
.sonuc-emoji { font-size: 5rem; }
.sonuc h2 { font-size: 1.8rem; margin: 6px 0; }
.sonuc-yildiz { font-size: 2.6rem; letter-spacing: 6px; margin: 10px 0; }
.sonuc p { font-weight: 700; color: #475569; font-size: 1.2rem; }
.sonuc-butonlar { display: flex; flex-direction: column; gap: 12px; margin-top: 22px; }
.sonuc-butonlar button {
  border: none; padding: 14px; border-radius: 18px; font-family: inherit;
  font-weight: 800; font-size: 1.1rem; cursor: pointer; color: #fff;
}
.tekrar-btn { background: var(--sari); box-shadow: 0 5px 0 #d97706; }
.sonraki-btn { background: var(--yesil); box-shadow: 0 5px 0 #16a34a; }
.harita-btn { background: var(--mor); box-shadow: 0 5px 0 #7c3aed; }

/* ---- Konfeti ---- */
.konfeti {
  position: fixed; top: -20px; width: 12px; height: 12px; border-radius: 3px;
  z-index: 999; animation: dus 2.2s linear forwards;
}
@keyframes dus {
  to { transform: translateY(110vh) rotate(720deg); opacity: 0; }
}

/* ---- Durak tip etiketi ---- */
.durak-tip {
  font-size: .62rem; font-weight: 800; background: #eef2ff; color: #6366f1;
  padding: 1px 8px; border-radius: 10px; margin-bottom: 2px;
}
.durak.tamam .durak-tip { background: rgba(255,255,255,.55); color: #92400e; }
.durak.kilitli .durak-tip { background: #e2e8f0; color: #94a3b8; }

/* ---- Oyun açıklaması ---- */
.oyun-aciklama {
  text-align: center; font-weight: 700; color: #475569; margin: 0 0 16px;
  background: #fff; padding: 12px 16px; border-radius: 16px; box-shadow: 0 4px 14px rgba(0,0,0,.08);
}

/* ---- Eşleştirme oyunu ---- */
.match-tahta { display: flex; gap: 16px; }
.match-sutun { flex: 1; display: flex; flex-direction: column; gap: 12px; }
.match-hucre {
  background: #fff; border: 3px solid #e2e8f0; border-radius: 18px; padding: 14px;
  font-family: inherit; font-weight: 800; cursor: pointer; transition: transform .1s;
  box-shadow: 0 4px 0 #cbd5e1; min-height: 60px;
}
.match-hucre.harf { font-family: "Amiri", serif; font-size: 2.4rem; color: var(--gok2); }
.match-hucre.isim { font-size: 1.2rem; color: var(--koyu); }
.match-hucre.secili { border-color: var(--mor); background: #ede9fe; transform: scale(1.04); }
.match-hucre.eslesti { border-color: var(--yesil); background: #dcfce7; opacity: .55; cursor: default; box-shadow: none; }
.match-hucre.yanlis-titre { animation: titre .4s; border-color: #f87171; }
@keyframes titre { 0%,100%{transform:translateX(0)} 25%{transform:translateX(-7px)} 75%{transform:translateX(7px)} }

/* ---- Dinle ve bul ---- */
.buyuk-dinle {
  display: block; margin: 0 auto 18px; background: var(--yesil); color: #fff; border: none;
  padding: 16px 30px; border-radius: 20px; font-family: inherit; font-weight: 800;
  font-size: 1.2rem; cursor: pointer; box-shadow: 0 5px 0 #16a34a;
}
.listen-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
.listen-hucre {
  background: #fff; border: 3px solid #e2e8f0; border-radius: 20px; padding: 18px;
  font-family: "Amiri", serif; font-size: 3.2rem; color: var(--gok2); cursor: pointer;
  box-shadow: 0 5px 0 #cbd5e1;
}
.listen-hucre.dogru { background: #dcfce7; border-color: var(--yesil); }
.listen-hucre.yanlis { background: #fee2e2; border-color: #f87171; }

/* ---- Hafıza oyunu ---- */
.memory-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
.memory-kart {
  position: relative; aspect-ratio: 3/4; border: none; background: transparent;
  cursor: pointer; padding: 0; perspective: 600px;
}
.memory-on, .memory-arka {
  position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
  border-radius: 16px; font-weight: 800; backface-visibility: hidden; transition: transform .35s;
}
.memory-on { background: linear-gradient(135deg, var(--gok2), var(--mor)); color: #fff; font-size: 2rem; box-shadow: 0 4px 0 rgba(0,0,0,.15); }
.memory-arka {
  background: #fff; color: var(--koyu); font-size: 1.1rem; transform: rotateY(180deg);
  border: 3px solid #e2e8f0; font-family: "Amiri", serif;
}
.memory-arka:not(:empty) { font-size: 2.4rem; }
.memory-kart.acik .memory-on { transform: rotateY(180deg); }
.memory-kart.acik .memory-arka { transform: rotateY(360deg); }
.memory-kart.eslesti .memory-arka { background: #dcfce7; border-color: var(--yesil); }

/* ---- Harf izi (çizme) ---- */
.trace-kutu { position: relative; width: 300px; max-width: 90vw; aspect-ratio: 1; margin: 0 auto; }
.trace-harf {
  position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
  font-family: "Amiri", serif; font-size: 13rem; color: #e2e8f0; user-select: none; pointer-events: none;
}
.trace-canvas {
  position: relative; width: 100%; height: 100%; background: #fff;
  border-radius: 24px; box-shadow: 0 8px 24px rgba(0,0,0,.12); touch-action: none;
}
.trace-ad { text-align: center; font-weight: 800; font-size: 1.5rem; margin: 14px 0; color: var(--koyu); }
.dinle-mini { background: none; border: none; cursor: pointer; font-size: 1.3rem; }

/* ---- Sure okuma ---- */
.sure-kart {
  background: #fff; border-radius: 26px; padding: 26px 20px; text-align: center;
  box-shadow: 0 10px 30px rgba(0,0,0,.14); margin-bottom: 16px; animation: pop .3s ease;
}
.sure-no { font-weight: 800; color: var(--mor); margin-bottom: 12px; }
.sure-arapca { font-family: "Amiri", serif; font-size: 2.6rem; line-height: 1.8; color: var(--koyu); direction: rtl; }
.sure-okunus { font-size: 1.3rem; font-weight: 800; color: var(--gok2); margin-top: 14px; }
.sure-meal { color: #64748b; font-weight: 600; margin-top: 8px; font-style: italic; }
.sure-kart .dinle {
  margin-top: 18px; background: var(--yesil); color: #fff; border: none;
  padding: 12px 26px; border-radius: 18px; font-family: inherit; font-weight: 800;
  font-size: 1.1rem; cursor: pointer; box-shadow: 0 5px 0 #16a34a;
}

@media (max-width: 380px) {
  .durak { width: 130px; }
  .harf-buyuk { font-size: 4.5rem; }
  .trace-harf { font-size: 10rem; }
  .listen-hucre { font-size: 2.6rem; }
}

  </style>
</head>
<body>
  <div id="app"></div>
  <script>
/*
 * Kur'an Yolculuğu - Müfredat Verisi
 * Çocuklar için Elif-Ba öğretimi.
 * Her "durak" (station) bir öğrenme etkinliği içerir.
 *
 * Durak tipleri (type):
 *   'lesson' -> öğrenme kartları + çoktan seçmeli mini test
 *   'match'  -> eşleştirme oyunu (harf <-> isim)
 *   'listen' -> dinle ve doğru harfi bul
 *   'memory' -> hafıza kartları (aynı çifti bul)
 *   'trace'  -> harf izi (parmakla/fareyle harfin üzerinden geç)
 *   'sure'   -> kısa sure okuma (kelime kelime)
 */

// Arap harfleri: glyph (harf), name (Türkçe okunuşu), hint (ipucu/benzetme)
const HARFLER = [
  { glyph: "ا", name: "Elif", hint: "Dümdüz ayakta duran çubuk gibi" },
  { glyph: "ب", name: "Be",   hint: "Altında bir nokta olan kayık" },
  { glyph: "ت", name: "Te",   hint: "Üstünde iki nokta olan kayık" },
  { glyph: "ث", name: "Se",   hint: "Üstünde üç nokta olan kayık" },
  { glyph: "ج", name: "Cim",  hint: "İçinde bir nokta olan kanca" },
  { glyph: "ح", name: "Ha",   hint: "Noktasız kanca" },
  { glyph: "خ", name: "Hı",   hint: "Üstünde bir nokta olan kanca" },
  { glyph: "د", name: "Dal",  hint: "Eğik küçük çengel" },
  { glyph: "ذ", name: "Zel",  hint: "Üstünde bir nokta olan çengel" },
  { glyph: "ر", name: "Ra",   hint: "Aşağı kıvrılan kuyruk" },
  { glyph: "ز", name: "Ze",   hint: "Üstünde nokta olan kuyruk" },
  { glyph: "س", name: "Sin",  hint: "Üç dişli tarak" },
  { glyph: "ش", name: "Şın",  hint: "Üstünde üç nokta olan tarak" },
  { glyph: "ص", name: "Sad",  hint: "Yumru karınlı harf" },
  { glyph: "ض", name: "Dad",  hint: "Üstünde nokta olan yumru" },
  { glyph: "ط", name: "Tı",   hint: "Bayrak direkli kutu" },
  { glyph: "ظ", name: "Zı",   hint: "Üstünde nokta olan bayrak" },
  { glyph: "ع", name: "Ayn",  hint: "Açık ağız gibi" },
  { glyph: "غ", name: "Gayn", hint: "Üstünde nokta olan ağız" },
  { glyph: "ف", name: "Fe",   hint: "Üstünde bir nokta olan halka" },
  { glyph: "ق", name: "Kaf",  hint: "Üstünde iki nokta olan halka" },
  { glyph: "ك", name: "Kef",  hint: "Anahtar gibi" },
  { glyph: "ل", name: "Lam",  hint: "Uzun kanca" },
  { glyph: "م", name: "Mim",  hint: "Küçük yuvarlak başlı" },
  { glyph: "ن", name: "Nun",  hint: "Üstünde nokta olan çanak" },
  { glyph: "ه", name: "He",   hint: "Yuvarlak düğüm" },
  { glyph: "و", name: "Vav",  hint: "Yuvarlak başlı kuyruk" },
  { glyph: "ي", name: "Ye",   hint: "Altında iki nokta olan kuyruk" },
];

// Harekeler (sesli işaretler)
const HAREKELER = [
  { glyph: "بَ", name: "Üstün (e/a)", hint: "Harfin üstünde küçük çizgi: 'e' sesi" },
  { glyph: "بِ", name: "Esre (i)",    hint: "Harfin altında küçük çizgi: 'i' sesi" },
  { glyph: "بُ", name: "Ötre (u)",    hint: "Harfin üstünde küçük vav: 'u' sesi" },
];

// Harflerin başta/ortada/sonda aldığı şekiller
const HARF_SEKILLERI = [
  { name: "Be",  glyph: "ب", bas: "بـ", orta: "ـبـ", son: "ـب" },
  { name: "Sin", glyph: "س", bas: "سـ", orta: "ـسـ", son: "ـس" },
  { name: "Mim", glyph: "م", bas: "مـ", orta: "ـمـ", son: "ـم" },
  { name: "Ayn", glyph: "ع", bas: "عـ", orta: "ـعـ", son: "ـع" },
  { name: "He",  glyph: "ه", bas: "هـ", orta: "ـهـ", son: "ـه" },
  { name: "Kef", glyph: "ك", bas: "كـ", orta: "ـكـ", son: "ـك" },
];

// Arapça rakamlar
const RAKAMLAR = [
  { glyph: "٠", name: "Sıfır", hint: "0" },
  { glyph: "١", name: "Bir",   hint: "1" },
  { glyph: "٢", name: "İki",   hint: "2" },
  { glyph: "٣", name: "Üç",    hint: "3" },
  { glyph: "٤", name: "Dört",  hint: "4" },
  { glyph: "٥", name: "Beş",   hint: "5" },
  { glyph: "٦", name: "Altı",  hint: "6" },
  { glyph: "٧", name: "Yedi",  hint: "7" },
  { glyph: "٨", name: "Sekiz", hint: "8" },
  { glyph: "٩", name: "Dokuz", hint: "9" },
];

// Kısa sureler (kelime kelime okunuş)
const SURELER = {
  ihlas: {
    ad: "İhlâs Sûresi",
    bilgi: "Allah'ın bir ve tek olduğunu anlatır.",
    ayetler: [
      { glyph: "قُلْ هُوَ اللّٰهُ اَحَدٌ", okunus: "Kul hüvallâhü ehad", meal: "De ki: O Allah birdir." },
      { glyph: "اَللّٰهُ الصَّمَدُ", okunus: "Allâhü's-samed", meal: "Allah hiçbir şeye muhtaç değildir." },
      { glyph: "لَمْ يَلِدْ وَلَمْ يُولَدْ", okunus: "Lem yelid ve lem yûled", meal: "O doğurmamış ve doğmamıştır." },
      { glyph: "وَلَمْ يَكُنْ لَهُ كُفُوًا اَحَدٌ", okunus: "Ve lem yekün lehû küfüven ehad", meal: "Hiçbir şey O'na denk değildir." },
    ],
  },
  kevser: {
    ad: "Kevser Sûresi",
    bilgi: "Kur'an'ın en kısa suresidir.",
    ayetler: [
      { glyph: "اِنَّٓا اَعْطَيْنَاكَ الْكَوْثَرَ", okunus: "İnnâ a'taynâ ke'l-kevser", meal: "Biz sana Kevser'i verdik." },
      { glyph: "فَصَلِّ لِرَبِّكَ وَانْحَرْ", okunus: "Fe salli li rabbike venhar", meal: "Öyleyse Rabbin için namaz kıl ve kurban kes." },
      { glyph: "اِنَّ شَانِئَكَ هُوَ الْاَبْتَرُ", okunus: "İnne şânieke hüve'l-ebter", meal: "Asıl soyu kesik olan sana kin tutandır." },
    ],
  },
  nas: {
    ad: "Nâs Sûresi",
    bilgi: "Kötülüklerden Allah'a sığınmayı öğretir.",
    ayetler: [

// Harf şekli kartı üretir (lesson kartı formatında)
function sekilKart(s) {
  return {
    glyph: `${s.bas}  ${s.orta}  ${s.son}`,
    name: s.name,
    hint: `Başta: ${s.bas} • Ortada: ${s.orta} • Sonda: ${s.son}`,
  };
}

// Harf şekilleri için mini test
function makeSekilQuiz(grup) {
  return grup.map((s) => ({
    q: `Bu hangi harfin başta hâlidir?  ${s.bas}`,
    a: s.name,
    options: shuffleArr([s.name, ...shuffleArr(HARF_SEKILLERI.filter((x) => x.name !== s.name)).slice(0, 2).map((x) => x.name)]),
    glyph: s.bas,
  }));
}

// Bir harf grubundan çoktan seçmeli test üretir.
function makeLetterQuiz(group, pool, limit) {
  const items = limit ? shuffleArr(group).slice(0, limit) : group;
  return items.map((item) => {
    const wrongs = shuffleArr(pool.filter((h) => h.name !== item.name))
      .slice(0, 2)
      .map((h) => h.name);
    return {
      q: `Bu harfin adı nedir?  ${item.glyph}`,
      a: item.name,
      options: shuffleArr([item.name, ...wrongs]),
      glyph: item.glyph,
    };
  });
}

function shuffleArr(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

// Tüm durakları sıralı tek listeye çevirir (harita için).
function tumDuraklar() {
  const list = [];
  BOLGELER.forEach((b) => b.duraklar.forEach((d) => list.push({ ...d, bolge: b })));
  return list;
}

/*

const STORAGE_KEY = "kuranYolculugu_v1";

// ---- İlerleme (localStorage) ----
function ilerlemeYukle() {
  try {
    return JSON.parse(localStorage.getItem(STORAGE_KEY)) || { tamamlanan: {}, yildiz: {} };
  } catch {
    return { tamamlanan: {}, yildiz: {} };
  }
}
function ilerlemeKaydet(p) {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(p));
}
let ILERLEME = ilerlemeYukle();

const DURAKLAR = tumDuraklar();

// Bir durağın kilidi açık mı? (ilk durak hep açık, sonrakiler önceki tamamlanınca açılır)
function durakAcikMi(index) {
  if (index === 0) return true;
  return !!ILERLEME.tamamlanan[DURAKLAR[index - 1].id];
}

// ---- Ses sistemi ----
// Konuşma: uygulamada (Capacitor) cihazın NATIVE TTS motoru; tarayıcıda Web Speech API.
let _sesler = [];
function _seslerYukle() {
  try { _sesler = "speechSynthesis" in window ? speechSynthesis.getVoices() : []; } catch { _sesler = []; }
}
if (typeof window !== "undefined" && "speechSynthesis" in window) {
  _seslerYukle();
  window.speechSynthesis.onvoiceschanged = _seslerYukle;
}

function seslendir(metin) {
  // 1) Native uygulama (Capacitor) -> cihazın kendi TTS motoru (WebView'de en güvenilir yol)
  const cap = window.Capacitor;
  if (cap && cap.Plugins && cap.Plugins.TextToSpeech) {
    try {
      cap.Plugins.TextToSpeech.stop().catch(() => {});
      cap.Plugins.TextToSpeech.speak({
        text: metin, lang: "tr-TR", rate: 1.0, pitch: 1.1, volume: 1.0, category: "playback",
      }).catch(() => {});
      return;
    } catch {}
  }
  // 2) Tarayıcı -> Web Speech API
  if ("speechSynthesis" in window) {
    try {
      speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(metin);
      const tr = _sesler.find((v) => /tr/i.test(v.lang));
      if (tr) u.voice = tr;
      u.lang = "tr-TR"; u.rate = 0.9; u.pitch = 1.1;
      speechSynthesis.speak(u);
    } catch {}
  }
}

// Ses efektleri: TEK paylaşılan AudioContext (her seferinde yeni açmak WebView limitine takılır).
let _ctx = null;
function _audio() {
  try {
    if (!_ctx) _ctx = new (window.AudioContext || window.webkitAudioContext)();
    if (_ctx.state === "suspended") _ctx.resume();

}
// İlk dokunuş/tıklamada ses kilidini aç (tarayıcı & WebView otomatik oynatma kuralı).
function _sesKilidiAc() { _audio(); }

function tonCal(freqs, sure = 0.12) {
  const ctx = _audio();
  if (!ctx) return;
  try {
    let t = ctx.currentTime;
    freqs.forEach((f) => {
      const o = ctx.createOscillator();
      const g = ctx.createGain();
      o.type = "sine";
      o.frequency.value = f;

      g.gain.exponentialRampToValueAtTime(0.25, t + 0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, t + sure);
      o.connect(g).connect(ctx.destination);
      o.start(t);
      o.stop(t + sure);
      t += sure;

  } catch {}
}

    ilerlemeKaydet(ILERLEME);
    sesBasari();
  } else {
    sesYanlis();
  }
  sonucGoster(durak, index, yildiz, dogru, toplam, mesaj);
}

function sonucGoster(durak, index, yildiz, dogru, toplam, mesaj) {
  const gecti = yildiz >= 1;
  const sonrakiVar = index < DURAKLAR.length - 1;
  app.innerHTML = "";
  const wrap = document.createElement("div");
  wrap.className = "test-wrap";
  wrap.innerHTML = `
    <div class="sonuc ${gecti ? "basarili" : "tekrar"}">
      <div class="sonuc-emoji">${gecti ? "🏆" : "💪"}</div>
      <h2>${gecti ? "Tebrikler!" : "Az Kaldı!"}</h2>
      <div class="sonuc-yildiz">${"⭐".repeat(yildiz)}${"☆".repeat(3 - yildiz)}</div>
      <p>${mesaj || (toplam ? `${dogru} / ${toplam} doğru` : "")}</p>
      <div class="sonuc-butonlar">
        <button class="tekrar-btn">🔁 Tekrar Dene</button>
        ${gecti && sonrakiVar ? `<button class="sonraki-btn">Sonraki Durak ▶</button>` : ""}
        <button class="harita-btn">🗺️ Haritaya Dön</button>
      </div>
    </div>`;
  app.appendChild(wrap);
  if (gecti) konfetiPatlat();
  wrap.querySelector(".tekrar-btn").addEventListener("click", () => durakAc(durak, index));
  wrap.querySelector(".harita-btn").addEventListener("click", render);
  const sb = wrap.querySelector(".sonraki-btn");
  if (sb) sb.addEventListener("click", () => durakAc(DURAKLAR[index + 1], index + 1));
  window.scrollTo(0, 0);
}

// ---- DERS EKRANI (kartlar + test) ----
function derseGir(durak, index) {
  let kartNo = 0;
  app.innerHTML = "";
  const wrap = document.createElement("div");
  wrap.className = "ders-wrap";
  wrap.appendChild(ustBaslik(durak));

  const kartAlan = document.createElement("div");
  kartAlan.className = "kart-alan";
  wrap.appendChild(kartAlan);

  const altBar = document.createElement("div");
  altBar.className = "kart-nav";
  altBar.innerHTML = `
    <button class="onceki">◀ Geri</button>
    <span class="kart-sayac"></span>
    <button class="sonraki">İleri ▶</button>`;
  wrap.appendChild(altBar);

  function kartCiz() {
    const k = durak.cards[kartNo];
    kartAlan.innerHTML = `
      <div class="flashcard">
        <div class="harf-buyuk">${k.glyph}</div>
        <div class="harf-ad">${k.name}</div>
        <div class="harf-ipucu">${k.hint || ""}</div>
        <button class="dinle">🔊 Dinle</button>
      </div>`;
    kartAlan.querySelector(".dinle").addEventListener("click", () => seslendir(k.name));
    seslendir(k.name);
    altBar.querySelector(".kart-sayac").textContent = `${kartNo + 1} / ${durak.cards.length}`;
    altBar.querySelector(".onceki").disabled = kartNo === 0;
    altBar.querySelector(".sonraki").textContent =
      kartNo === durak.cards.length - 1
        ? (durak.quiz ? "Teste Geç ✏️" : "Bitir 🏁")
        : "İleri ▶";
  }

  altBar.querySelector(".onceki").addEventListener("click", () => { if (kartNo > 0) { kartNo--; kartCiz(); } });
  altBar.querySelector(".sonraki").addEventListener("click", () => {
    if (kartNo < durak.cards.length - 1) { kartNo++; kartCiz(); }
    else if (durak.quiz) testeGir(durak, index);
    else tamamla(durak, index, 3, 0, 0, "Bütün kartları öğrendin! 🎉");
  });

  app.appendChild(wrap);
  kartCiz();
  window.scrollTo(0, 0);
}

// ---- TEST EKRANI ----
function testeGir(durak, index) {
  const sorular = shuffleArr(durak.quiz);
  let soruNo = 0, dogru = 0;
  app.innerHTML = "";
  const wrap = document.createElement("div");
  wrap.className = "test-wrap";
  app.appendChild(wrap);

  function soruCiz() {
    const s = sorular[soruNo];
    wrap.innerHTML = `
      <div class="test-ust">
        <button class="geri">← Çık</button>
        <div class="ilerleme-cubuk"><div style="width:${(soruNo / sorular.length) * 100}%"></div></div>
        <span>${soruNo + 1}/${sorular.length}</span>
      </div>
      <div class="soru">${s.glyph ? `<div class="soru-harf">${s.glyph}</div>` : ""}<p>${s.q.replace(s.glyph || "@@@", "")}</p></div>
      <div class="secenekler"></div>
      <div class="geri-bildirim"></div>`;
    wrap.querySelector(".geri").addEventListener("click", render);
    const sec = wrap.querySelector(".secenekler");
    shuffleArr(s.options).forEach((opt) => {
      const b = document.createElement("button");
      b.className = "secenek";
      b.textContent = opt;
      b.addEventListener("click", () => cevapVer(b, opt, s));
      sec.appendChild(b);
    });
  }

  function cevapVer(btn, opt, s) {
    wrap.querySelectorAll(".secenek").forEach((b) => (b.disabled = true));
    const gb = wrap.querySelector(".geri-bildirim");
    if (opt === s.a) {
      btn.classList.add("dogru"); dogru++; sesDogru();
      gb.innerHTML = `<span class="iyi">Aferin! 🎉</span>`;
    } else {
      btn.classList.add("yanlis"); sesYanlis();
      wrap.querySelectorAll(".secenek").forEach((b) => { if (b.textContent === s.a) b.classList.add("dogru"); });
      gb.innerHTML = `<span class="kotu">Doğrusu: <b>${s.a}</b></span>`;
    }
    const ileri = document.createElement("button");
    ileri.className = "devam";
    ileri.textContent = soruNo === sorular.length - 1 ? "Bitir 🏁" : "Devam ▶";
    ileri.addEventListener("click", () => {
      soruNo++;
      if (soruNo < sorular.length) soruCiz();
      else {
        const oran = dogru / sorular.length;
        const yildiz = oran >= 0.99 ? 3 : oran >= 0.7 ? 2 : oran >= 0.5 ? 1 : 0;
        tamamla(durak, index, yildiz, dogru, sorular.length);
      }
    });
    gb.appendChild(ileri);
  }
  soruCiz();
  window.scrollTo(0, 0);
}

// ---- EŞLEŞTİRME OYUNU (harf <-> isim) ----
function oyunMatch(durak, index) {
  const secilenler = shuffleArr(durak.pairs).slice(0, 5);
  let seciliHarf = null, eslesen = 0;
  app.innerHTML = "";
  const wrap = document.createElement("div");
  wrap.className = "ders-wrap";
  wrap.appendChild(ustBaslik(durak));
  const aciklama = document.createElement("p");
  aciklama.className = "oyun-aciklama";
  aciklama.textContent = "Harfi, doğru ismiyle eşleştir! Önce harfe, sonra ismine dokun.";
  wrap.appendChild(aciklama);

  const tahta = document.createElement("div");
  tahta.className = "match-tahta";
  const solSutun = document.createElement("div"); solSutun.className = "match-sutun";
  const sagSutun = document.createElement("div"); sagSutun.className = "match-sutun";
  tahta.appendChild(solSutun); tahta.appendChild(sagSutun);
  wrap.appendChild(tahta);
  app.appendChild(wrap);

  shuffleArr(secilenler).forEach((p) => {
    const b = document.createElement("button");
    b.className = "match-hucre harf"; b.textContent = p.glyph; b.dataset.name = p.name;
    b.addEventListener("click", () => harfSec(b, p));
    solSutun.appendChild(b);
  });
  shuffleArr(secilenler).forEach((p) => {
    const b = document.createElement("button");
    b.className = "match-hucre isim"; b.textContent = p.name; b.dataset.name = p.name;
    b.addEventListener("click", () => isimSec(b, p));
    sagSutun.appendChild(b);
  });

  function harfSec(btn, p) {
    if (btn.classList.contains("eslesti")) return;
    solSutun.querySelectorAll(".match-hucre").forEach((x) => x.classList.remove("secili"));
    btn.classList.add("secili");
    seciliHarf = { btn, p };
    seslendir(p.name);
  }
  function isimSec(btn, p) {
    if (!seciliHarf || btn.classList.contains("eslesti")) return;
    if (seciliHarf.p.name === p.name) {
      seciliHarf.btn.classList.add("eslesti"); btn.classList.add("eslesti");
      seciliHarf.btn.classList.remove("secili");
      sesDogru(); eslesen++;
      seciliHarf = null;
      if (eslesen === secilenler.length)
        setTimeout(() => tamamla(durak, index, 3, eslesen, secilenler.length, "Hepsini eşleştirdin! 🧩"), 500);
    } else {
      sesYanlis();
      btn.classList.add("yanlis-titre");
      setTimeout(() => btn.classList.remove("yanlis-titre"), 400);
    }
  }
  window.scrollTo(0, 0);
}

// ---- DİNLE VE BUL OYUNU ----
function oyunListen(durak, index) {
  const tur = shuffleArr(durak.items).slice(0, 6);
  let turNo = 0, dogru = 0;
  app.innerHTML = "";
  const wrap = document.createElement("div");
  wrap.className = "ders-wrap";
  wrap.appendChild(ustBaslik(durak));
  app.appendChild(wrap);
  const alan = document.createElement("div");
  wrap.appendChild(alan);

  function turCiz() {
    const hedef = tur[turNo];
    const yanlislar = shuffleArr(durak.items.filter((x) => x.name !== hedef.name)).slice(0, 3);
    const secenekler = shuffleArr([hedef, ...yanlislar]);
    alan.innerHTML = `
      <p class="oyun-aciklama">Sesi dinle ve doğru harfi bul!</p>
      <button class="buyuk-dinle">🔊 Tekrar Dinle</button>
      <div class="listen-grid"></div>
      <div class="geri-bildirim"></div>`;
    alan.querySelector(".buyuk-dinle").addEventListener("click", () => seslendir(hedef.name));
    seslendir(hedef.name);
    const grid = alan.querySelector(".listen-grid");
    secenekler.forEach((opt) => {
      const b = document.createElement("button");
      b.className = "listen-hucre"; b.textContent = opt.glyph;
      b.addEventListener("click", () => sec(b, opt, hedef));
      grid.appendChild(b);
    });
  }
  function sec(btn, opt, hedef) {
    alan.querySelectorAll(".listen-hucre").forEach((b) => (b.disabled = true));
    const gb = alan.querySelector(".geri-bildirim");
    if (opt.name === hedef.name) {
      btn.classList.add("dogru"); dogru++; sesDogru();
      gb.innerHTML = `<span class="iyi">Doğru: ${hedef.glyph} = ${hedef.name} 🎉</span>`;
    } else {
      btn.classList.add("yanlis"); sesYanlis();
      alan.querySelectorAll(".listen-hucre").forEach((b) => { if (b.textContent === hedef.glyph) b.classList.add("dogru"); });
      gb.innerHTML = `<span class="kotu">Doğrusu: ${hedef.glyph} = <b>${hedef.name}</b></span>`;
    }
    const ileri = document.createElement("button");
    ileri.className = "devam";
    ileri.textContent = turNo === tur.length - 1 ? "Bitir 🏁" : "Devam ▶";
    ileri.addEventListener("click", () => {
      turNo++;
      if (turNo < tur.length) turCiz();
      else {
        const oran = dogru / tur.length;
        tamamla(durak, index, oran >= 0.99 ? 3 : oran >= 0.7 ? 2 : oran >= 0.5 ? 1 : 0, dogru, tur.length);
      }
    });
    gb.appendChild(ileri);
  }
  turCiz();
  window.scrollTo(0, 0);
}

// ---- HAFIZA OYUNU (eş kartları bul) ----
function oyunMemory(durak, index) {
  const secilen = shuffleArr(durak.pairs).slice(0, 6);
  // her çift için iki kart: biri harf, biri isim, aynı 'key'
  const kartlar = shuffleArr(
    secilen.flatMap((p) => [
      { key: p.name, yuz: p.glyph, tip: "harf" },
      { key: p.name, yuz: p.name, tip: "isim" },
    ])
  );
  let acik = [], eslesen = 0, kilit = false;
  app.innerHTML = "";
  const wrap = document.createElement("div");
  wrap.className = "ders-wrap";
  wrap.appendChild(ustBaslik(durak));
  const aciklama = document.createElement("p");
  aciklama.className = "oyun-aciklama";
  aciklama.textContent = "Kartları çevir, harfi ismiyle eşleştir! 🃏";
  wrap.appendChild(aciklama);
  const grid = document.createElement("div");
  grid.className = "memory-grid";
  wrap.appendChild(grid);
  app.appendChild(wrap);

  kartlar.forEach((k) => {
    const c = document.createElement("button");
    c.className = "memory-kart";
    c.innerHTML = `<span class="memory-on">?</span><span class="memory-arka">${k.yuz}</span>`;
    c.addEventListener("click", () => cevir(c, k));
    grid.appendChild(c);
  });

  function cevir(el, k) {
    if (kilit || el.classList.contains("acik") || el.classList.contains("eslesti")) return;
    el.classList.add("acik");
    if (k.tip === "isim") seslendir(k.yuz);
    acik.push({ el, k });
    if (acik.length === 2) {
      kilit = true;
      if (acik[0].k.key === acik[1].k.key) {
        sesDogru();
        acik.forEach((a) => a.el.classList.add("eslesti"));
        eslesen++;
        acik = []; kilit = false;
        if (eslesen === secilen.length)
          setTimeout(() => tamamla(durak, index, 3, eslesen, secilen.length, "Tüm çiftleri buldun! 🧠"), 500);
      } else {
        sesYanlis();
        setTimeout(() => {
          acik.forEach((a) => a.el.classList.remove("acik"));
          acik = []; kilit = false;
        }, 800);
      }
    }
  }
  window.scrollTo(0, 0);
}

// ---- HARF İZİ (parmakla/fareyle çizme) ----
function oyunTrace(durak, index) {
  let kartNo = 0;
  app.innerHTML = "";
  const wrap = document.createElement("div");
  wrap.className = "ders-wrap";
  wrap.appendChild(ustBaslik(durak));
  const aciklama = document.createElement("p");
  aciklama.className = "oyun-aciklama";
  aciklama.textContent = "Harfin üzerinden parmağınla (veya fareyle) geçerek çiz! ✏️";
  wrap.appendChild(aciklama);
  const alan = document.createElement("div");
  wrap.appendChild(alan);
  app.appendChild(wrap);

  function ciz() {
    const k = durak.cards[kartNo];
    alan.innerHTML = `
      <div class="trace-kutu">
        <div class="trace-harf">${k.glyph}</div>
        <canvas class="trace-canvas" width="300" height="300"></canvas>
      </div>
      <div class="trace-ad">${k.name} <button class="dinle-mini">🔊</button></div>
      <div class="kart-nav">
        <button class="temizle">🧽 Temizle</button>
        <span class="kart-sayac">${kartNo + 1} / ${durak.cards.length}</span>
        <button class="sonraki">${kartNo === durak.cards.length - 1 ? "Bitir 🏁" : "Sonraki ▶"}</button>
      </div>`;
    alan.querySelector(".dinle-mini").addEventListener("click", () => seslendir(k.name));
    seslendir(k.name);

    const canvas = alan.querySelector(".trace-canvas");
    const ctx = canvas.getContext("2d");
    ctx.lineWidth = 14; ctx.lineCap = "round"; ctx.lineJoin = "round"; ctx.strokeStyle = "#38bdf8";
    let ciziyor = false;
    const nokta = (e) => {
      const r = canvas.getBoundingClientRect();
      const t = e.touches ? e.touches[0] : e;
      return { x: (t.clientX - r.left) * (canvas.width / r.width), y: (t.clientY - r.top) * (canvas.height / r.height) };
    };
    const basla = (e) => { e.preventDefault(); ciziyor = true; const p = nokta(e); ctx.beginPath(); ctx.moveTo(p.x, p.y); };
    const devam = (e) => { if (!ciziyor) return; e.preventDefault(); const p = nokta(e); ctx.lineTo(p.x, p.y); ctx.stroke(); };
    const bitir = () => { ciziyor = false; };
    canvas.addEventListener("mousedown", basla); canvas.addEventListener("mousemove", devam);
    window.addEventListener("mouseup", bitir);
    canvas.addEventListener("touchstart", basla, { passive: false });
    canvas.addEventListener("touchmove", devam, { passive: false });
    canvas.addEventListener("touchend", bitir);

    alan.querySelector(".temizle").addEventListener("click", () => ctx.clearRect(0, 0, canvas.width, canvas.height));
    alan.querySelector(".sonraki").addEventListener("click", () => {
      tonCal([523]);
      if (kartNo < durak.cards.length - 1) { kartNo++; ciz(); }
      else tamamla(durak, index, 3, 0, 0, "Tüm harfleri çizdin! ✏️🎉");
    });
  }
  ciz();
  window.scrollTo(0, 0);
}

// ---- Konfeti efekti ----
function konfetiPatlat() {
  const renkler = ["#f87171", "#fbbf24", "#34d399", "#60a5fa", "#a78bfa", "#f472b6"];
  for (let i = 0; i < 40; i++) {
    const k = document.createElement("div");
    k.className = "konfeti";
    k.style.left = Math.random() * 100 + "vw";
    k.style.background = renkler[Math.floor(Math.random() * renkler.length)];
    k.style.animationDelay = Math.random() * 0.5 + "s";
    document.body.appendChild(k);
    setTimeout(() => k.remove(), 2500);
  }
}
