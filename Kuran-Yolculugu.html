// Dokunmatik yön tuşları (D-pad) üretir
function yonTuslari(alan, onYon) {
  const pad = document.createElement("div");
  pad.className = "retro-dpad";
  [["up", "▲"], ["left", "◀"], ["right", "▶"], ["down", "▼"]].forEach(([yon, sim]) => {
    const b = document.createElement("button");
    b.className = "dbtn d-" + yon;
    b.textContent = sim;
    b.addEventListener("click", (e) => { e.preventDefault(); onYon(yon); });
    pad.appendChild(b);
  });
  alan.appendChild(pad);
  return pad;
}

// ---- 1) YILAN ----
function retroYilan(durak, index) {
  const alan = retroKabuk("🐍 Yılan", "Başlamak için dokun/yön ver • duvardan geçer, kendine çarpınca biter • ⭐ bonus topla!");
  const N = 15, CELL = 20, BOY = N * CELL;
  const cv = document.createElement("canvas");
  cv.width = BOY; cv.height = BOY; cv.className = "retro-canvas";
  alan.appendChild(cv);
  const ctx = cv.getContext("2d");
  const skorEl = document.createElement("div");
  skorEl.className = "retro-skor"; skorEl.textContent = "Skor: 0";
  alan.appendChild(skorEl);

  const GOVDE = ["#22c55e", "#10b981", "#14b8a6", "#06b6d4", "#3b82f6", "#8b5cf6"]; // renkli gövde
  let yilan = [{ x: 7, y: 7 }], dir = { x: 1, y: 0 }, nextDir = dir;
  let skor = 0, bitti = false, basladi = false, bekle = 165, renkKay = 0;
  let bonus = null;          // yemKoy() bonus'a bakıyor; ondan ÖNCE tanımlı olmalı (TDZ hatasını önler)
  let yem = yemKoy();
  function yemKoy() {
    let p;
    do { p = { x: Math.floor(Math.random() * N), y: Math.floor(Math.random() * N) }; }
    while ((yilan && yilan.some((s) => s.x === p.x && s.y === p.y)) || (bonus && bonus.x === p.x && bonus.y === p.y));
    return p;
  }
  function ciz() {
    ctx.fillStyle = "#0b1220"; ctx.fillRect(0, 0, BOY, BOY);
    ctx.strokeStyle = "rgba(255,255,255,.05)"; ctx.lineWidth = 1;
    for (let i = 1; i < N; i++) { ctx.beginPath(); ctx.moveTo(i * CELL, 0); ctx.lineTo(i * CELL, BOY); ctx.moveTo(0, i * CELL); ctx.lineTo(BOY, i * CELL); ctx.stroke(); }
    ctx.font = CELL + "px serif"; ctx.textAlign = "center"; ctx.textBaseline = "middle";
    ctx.fillText("🍎", yem.x * CELL + CELL / 2, yem.y * CELL + CELL / 2);
    if (bonus) { ctx.globalAlpha = (bonus.omur < 12 && bonus.omur % 2) ? 0.35 : 1; ctx.fillText(bonus.emoji, bonus.x * CELL + CELL / 2, bonus.y * CELL + CELL / 2); ctx.globalAlpha = 1; }
    yilan.forEach((s, i) => {
      ctx.fillStyle = i === 0 ? "#fde047" : GOVDE[(i + renkKay) % GOVDE.length];
      ctx.fillRect(s.x * CELL + 1, s.y * CELL + 1, CELL - 2, CELL - 2);
    });
    if (!basladi) {
      ctx.fillStyle = "rgba(0,0,0,.55)"; ctx.fillRect(0, 0, BOY, BOY);
      ctx.fillStyle = "#fff"; ctx.font = "bold 18px sans-serif";
      ctx.fillText("Başlamak için", BOY / 2, BOY / 2 - 12);
      ctx.fillText("dokun / yön ver ▶", BOY / 2, BOY / 2 + 14);
    }
  }
  function adim() {
    if (bitti) return;
    dir = nextDir;
    const bas = { x: (yilan[0].x + dir.x + N) % N, y: (yilan[0].y + dir.y + N) % N }; // duvardan geç (sarmal)
    if (yilan.some((s) => s.x === bas.x && s.y === bas.y)) { // sadece kendine çarpınca biter
      bitti = true; sesYanlis();
      return retroBitti(durak, index, "Oyun Bitti", `🍎 Skor: ${skor}`);
    }
    yilan.unshift(bas);
    let yedi = false;
    if (bas.x === yem.x && bas.y === yem.y) {
      skor++; tonCal([660]); yem = yemKoy(); yedi = true; renkKay = (renkKay + 1) % GOVDE.length;
      bekle = Math.max(70, 165 - skor * 6); // her yemde hızlan
      if (!bonus && skor % 4 === 0) { const p = yemKoy(); bonus = { x: p.x, y: p.y, omur: 38, emoji: "⭐", puan: 5 }; }
    }
    if (bonus && bas.x === bonus.x && bas.y === bonus.y) { skor += bonus.puan; tonCal([880, 1040]); bonus = null; yedi = true; } // bonus = ekstra büyüme
    if (!yedi) yilan.pop();
    if (bonus) { bonus.omur--; if (bonus.omur <= 0) bonus = null; }
    skorEl.textContent = "Skor: " + skor;
    ciz();
  }
  function dongu() { if (bitti || !basladi) return; adim(); if (!bitti) _gec(dongu, bekle); }
  function basla() { if (!basladi && !bitti) { basladi = true; ciz(); dongu(); } }
  function yon(y) {
    if (y === "up" && dir.y === 0) nextDir = { x: 0, y: -1 };
    else if (y === "down" && dir.y === 0) nextDir = { x: 0, y: 1 };
    else if (y === "left" && dir.x === 0) nextDir = { x: -1, y: 0 };
    else if (y === "right" && dir.x === 0) nextDir = { x: 1, y: 0 };
    basla();
  }
  yonTuslari(alan, yon);
  cv.addEventListener("pointerdown", (e) => { e.preventDefault(); basla(); });
  document.onkeydown = (e) => {
    const m = { ArrowUp: "up", ArrowDown: "down", ArrowLeft: "left", ArrowRight: "right" };
    if (m[e.key]) { e.preventDefault(); yon(m[e.key]); }
  };
  ciz(); // başlamadan önce "dokun" ekranı
}

// ---- 2) UÇAN KUŞ (flappy) ----
function retroKus(durak, index) {
  const alan = retroKabuk("🐤 Uçan Kuş", "Ekrana dokun; ilerledikçe borular hızlanır ve daralır!");
  const W = 300, H = 420;
  const cv = document.createElement("canvas");
  cv.width = W; cv.height = H; cv.className = "retro-canvas";
  alan.appendChild(cv);
  const ctx = cv.getContext("2d");

  let y = H / 2, vy = 0, skor = 0, bitti = false, basladi = false;
  const G = 0.5, ZIPLA = -7.5, R = 14, GENIS = 46;
  const gapBoyu = () => Math.max(96, 150 - skor * 4);   // boşluk daralır
  const hizBoyu = () => Math.min(6, 2.3 + skor * 0.18); // borular hızlanır
  let borular = [{ x: W, bos: 130, gap: gapBoyu() }];
  function zipla() { if (bitti) return; if (!basladi) basladi = true; vy = ZIPLA; tonCal([520]); }
  cv.addEventListener("pointerdown", (e) => { e.preventDefault(); zipla(); });
  document.onkeydown = (e) => { if (e.key === " " || e.key === "ArrowUp") { e.preventDefault(); zipla(); } };

  function adim() {
    if (bitti) return;
    if (!basladi) { // ilk dokunuşu bekle: kuş süzülür, boru gelmez
      ctx.fillStyle = "#7dd3fc"; ctx.fillRect(0, 0, W, H);
      ctx.font = "26px serif"; ctx.textAlign = "center"; ctx.textBaseline = "middle";
      ctx.fillText("🐤", 60, y);
      ctx.fillStyle = "#1e3a5f"; ctx.font = "bold 18px sans-serif";
      ctx.fillText("Başlamak için dokun", W / 2, H / 2);
      return;
    }
    const hiz = hizBoyu();
    vy += G; y += vy;
    borular.forEach((b) => (b.x -= hiz));
    if (borular[borular.length - 1].x < W - 165) {
      const g = gapBoyu();
      borular.push({ x: W + 20, bos: 45 + Math.random() * (H - g - 95), gap: g });
    }
    borular = borular.filter((b) => b.x > -GENIS);
    for (const b of borular) {
      if (!b.gecti && b.x + GENIS < 60) { b.gecti = true; skor++; tonCal([700]); }
      if (60 + R > b.x && 60 - R < b.x + GENIS && (y - R < b.bos || y + R > b.bos + b.gap)) {
        bitti = true; sesYanlis();
        return retroBitti(durak, index, "Oyun Bitti", `🐤 Skor: ${skor}`);
      }
    }
    if (y + R > H || y - R < 0) {
      bitti = true; sesYanlis();
      return retroBitti(durak, index, "Oyun Bitti", `🐤 Skor: ${skor}`);
    }
    ctx.fillStyle = "#7dd3fc"; ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = "#16a34a";
    borular.forEach((b) => { ctx.fillRect(b.x, 0, GENIS, b.bos); ctx.fillRect(b.x, b.bos + b.gap, GENIS, H); });
    ctx.font = "26px serif"; ctx.textAlign = "center"; ctx.textBaseline = "middle";
    ctx.fillText("🐤", 60, y);
    ctx.fillStyle = "#1e3a5f"; ctx.font = "bold 24px sans-serif";
    ctx.fillText(skor, W / 2, 30);
  }
  _ara(adim, 24);
}

// ---- 3) TUĞLA KIR (breakout) ----
function retroTugla(durak, index) {
  const alan = retroKabuk("🧱 Tuğla Kır", "Parmağını SÜRÜKLE • bonuslar: 🟦 geniş, ⭐ puan, 🐢 yavaş, ⚽ 3 top, 🔫 ateş!");
  const W = 300, H = 380;
  const cv = document.createElement("canvas");
  cv.width = W; cv.height = H; cv.className = "retro-canvas";
  alan.appendChild(cv);
  const ctx = cv.getContext("2d");

  const PW0 = 64, PH = 12, BR = 7;
  let PW = PW0, genisKalan = 0, atesKalan = 0, skor = 0, bitti = false, sayac = 0;
  let px = W / 2 - PW / 2;
  let toplar = [{ x: W / 2, y: H - 40, vx: 2.6, vy: -3.2 }]; // birden çok top olabilir
  let dususler = [], mermiler = [];
  const BONUSLAR = [
    { e: "🟦", t: "genis" },  // çubuğu genişlet
    { e: "⭐", t: "puan" },   // +5 puan
    { e: "🐢", t: "yavas" },  // topları yavaşlat
    { e: "⚽", t: "cok" },    // 3 top (çoklu top)
    { e: "🔫", t: "ates" },   // çubuk ateş etsin
  ];
  const renkSat = ["#ef4444", "#f59e0b", "#fbbf24", "#34d399", "#60a5fa"];
  let tuglalar = [];
  const SUT = 5, KOL = 6, TG = 44, TH = 16, UST = 30, BOSL = 4;
  for (let r = 0; r < SUT; r++) for (let c = 0; c < KOL; c++)
    tuglalar.push({ x: 8 + c * (TG + BOSL), y: UST + r * (TH + BOSL), r, kirik: false });

  // Parmakla sürükleyerek çubuğu hareket ettir
  let suruk = false;
  function tasi(clientX) {
    const rect = cv.getBoundingClientRect();
    px = (clientX - rect.left) * (W / rect.width) - PW / 2;
    px = Math.max(0, Math.min(W - PW, px));
  }
  cv.addEventListener("pointerdown", (e) => { e.preventDefault(); suruk = true; try { cv.setPointerCapture(e.pointerId); } catch {} tasi(e.clientX); });
  cv.addEventListener("pointermove", (e) => { if (suruk) { e.preventDefault(); tasi(e.clientX); } });
  cv.addEventListener("pointerup", () => { suruk = false; });
  cv.addEventListener("pointercancel", () => { suruk = false; });

  function hizlaTop(b, faktor) {
    const m = Math.hypot(b.vx, b.vy) || 1;
    const yeni = Math.min(7.2, m * faktor);
    b.vx = (b.vx / m) * yeni; b.vy = (b.vy / m) * yeni;
  }
  function tuglaBul(x, y) {
    for (const t of tuglalar) { if (!t.kirik && x > t.x && x < t.x + TG && y > t.y && y < t.y + TH) return t; }
    return null;
  }
  function bonusDus(t) {
    if (Math.random() < 0.26) { const b = BONUSLAR[Math.floor(Math.random() * BONUSLAR.length)]; dususler.push({ x: t.x + TG / 2, y: t.y + TH, e: b.e, t: b.t }); }
  }

  function adim() {
    if (bitti) return;
    sayac++;
    if (genisKalan > 0) { genisKalan--; if (genisKalan === 0) { px += (PW - PW0) / 2; PW = PW0; } }
    if (atesKalan > 0) { atesKalan--; if (sayac % 12 === 0) { mermiler.push({ x: px + 6, y: H - PH - 8 }); mermiler.push({ x: px + PW - 6, y: H - PH - 8 }); tonCal([820]); } }

    // TOPLAR
    for (const b of toplar) {
      b.x += b.vx; b.y += b.vy;
      if (b.x - BR < 0 || b.x + BR > W) b.vx = -b.vx;
      if (b.y - BR < 0) b.vy = -b.vy;
      if (b.y + BR >= H - PH - 4 && b.x > px && b.x < px + PW && b.vy > 0) {
        b.vy = -Math.abs(b.vy); b.vx += ((b.x - (px + PW / 2)) / (PW / 2)) * 2; tonCal([440]);
      }
      const t = tuglaBul(b.x, b.y);
      if (t) { t.kirik = true; b.vy = -b.vy; skor++; tonCal([600 + t.r * 40]); hizlaTop(b, 1.03); bonusDus(t); }
    }
    toplar = toplar.filter((b) => b.y - BR <= H); // düşen topları at
    if (toplar.length === 0) { bitti = true; sesYanlis(); return retroBitti(durak, index, "Oyun Bitti", `🧱 ${skor} tuğla kırdın!`); }

    // MERMİLER (ateş bonusu)
    mermiler.forEach((m) => (m.y -= 6));
    for (const m of mermiler) { const t = tuglaBul(m.x, m.y); if (t) { t.kirik = true; m.vur = true; skor++; tonCal([680]); bonusDus(t); } }
    mermiler = mermiler.filter((m) => !m.vur && m.y > -8);

    // DÜŞEN BONUSLAR
    dususler.forEach((d) => (d.y += 2.4));
    for (const d of dususler) {
      if (!d.al && d.y >= H - PH - 8 && d.x > px && d.x < px + PW) {
        d.al = true;
        if (d.t === "genis") { if (genisKalan === 0) px -= (96 - PW0) / 2; PW = 96; genisKalan = 420; tonCal([700, 900]); }
        else if (d.t === "puan") { skor += 5; tonCal([1000]); }
        else if (d.t === "yavas") { toplar.forEach((b) => hizlaTop(b, 0.8)); tonCal([300, 360]); }
        else if (d.t === "cok") { // 3 topa çıkar
          const kaynak = toplar[0];
          for (let k = 0; k < 2 && toplar.length < 6; k++) toplar.push({ x: kaynak.x, y: kaynak.y, vx: (k === 0 ? -1 : 1) * Math.abs(kaynak.vx || 2.6) - 0.5, vy: -Math.abs(kaynak.vy || 3.2) });
          tonCal([500, 700, 900]);
        } else if (d.t === "ates") { atesKalan = 480; tonCal([900, 1100]); }
      }
    }
    dususler = dususler.filter((d) => !d.al && d.y < H + 16);

    if (tuglalar.every((t) => t.kirik)) { bitti = true; return retroBitti(durak, index, "Kazandın! 🎉", `🧱 Tüm tuğlaları kırdın! Skor: ${skor}`); }

    // ÇİZİM
    ctx.fillStyle = "#0f172a"; ctx.fillRect(0, 0, W, H);
    tuglalar.forEach((t) => { if (!t.kirik) { ctx.fillStyle = renkSat[t.r]; ctx.fillRect(t.x, t.y, TG, TH); } });
    ctx.font = "16px serif"; ctx.textAlign = "center"; ctx.textBaseline = "middle";
    dususler.forEach((d) => ctx.fillText(d.e, d.x, d.y));
    ctx.fillStyle = "#fca5a5"; mermiler.forEach((m) => ctx.fillRect(m.x - 2, m.y, 4, 9));
    ctx.fillStyle = atesKalan > 0 ? "#f87171" : genisKalan > 0 ? "#60a5fa" : "#e2e8f0"; ctx.fillRect(px, H - PH - 4, PW, PH);
    ctx.fillStyle = "#fbbf24"; toplar.forEach((b) => { ctx.beginPath(); ctx.arc(b.x, b.y, BR, 0, 7); ctx.fill(); });
    ctx.fillStyle = "#e2e8f0"; ctx.font = "bold 14px sans-serif"; ctx.textAlign = "left"; ctx.textBaseline = "alphabetic";
    ctx.fillText("Skor: " + skor + (toplar.length > 1 ? "  ⚽x" + toplar.length : "") + (atesKalan > 0 ? "  🔫" : ""), 8, 16);
  }
  _ara(adim, 18);
}

// ---- 4) UZAY ATIŞI (shooter) ----
function retroUzay(durak, index) {
  const alan = retroKabuk("🚀 Uzay Atışı", "Gemiyi SÜRÜKLE • otomatik ateş • ⚙️ silahını geliştir, ⭐ puan, ❤️ can topla!");
  const W = 300, H = 420;
  const cv = document.createElement("canvas");
  cv.width = W; cv.height = H; cv.className = "retro-canvas";
  alan.appendChild(cv);
  const ctx = cv.getContext("2d");

  let gx = W / 2, skor = 0, can = 3, bitti = false, silah = 1;
  let mermiler = [], taslar = [], oduller = [], sayac = 0;
  const ODULLER = [
    { e: "⚙️", t: "silah" }, // silahı geliştir (Lv1→2→3)
    { e: "⭐", t: "puan" },  // +5 puan
    { e: "❤️", t: "can" },   // +1 can (en çok 5)
  ];
  // Parmakla sürükleyerek gemiyi hareket ettir
  let suruk = false;
  function tasi(clientX) {
    const rect = cv.getBoundingClientRect();
    gx = (clientX - rect.left) * (W / rect.width);
    gx = Math.max(16, Math.min(W - 16, gx));
  }
  function ates() {
    if (bitti) return;
    tonCal([880]);
    if (silah <= 1) mermiler.push({ x: gx, y: H - 40, vx: 0 });
    else if (silah === 2) { mermiler.push({ x: gx - 8, y: H - 40, vx: 0 }); mermiler.push({ x: gx + 8, y: H - 40, vx: 0 }); }
    else { mermiler.push({ x: gx, y: H - 42, vx: 0 }); mermiler.push({ x: gx - 9, y: H - 38, vx: -1.7 }); mermiler.push({ x: gx + 9, y: H - 38, vx: 1.7 }); }
  }
  cv.addEventListener("pointerdown", (e) => { e.preventDefault(); suruk = true; try { cv.setPointerCapture(e.pointerId); } catch {} tasi(e.clientX); });
  cv.addEventListener("pointermove", (e) => { if (suruk) { e.preventDefault(); tasi(e.clientX); } });
  cv.addEventListener("pointerup", () => { suruk = false; });
  cv.addEventListener("pointercancel", () => { suruk = false; });

  function adim() {
    if (bitti) return;
    sayac++;
    const atesHer = 14;                                     // otomatik ateş aralığı
    const spawnHer = Math.max(11, 28 - Math.floor(skor / 2)); // skor arttıkça sık taş
    if (sayac % atesHer === 0) ates();
    if (sayac % spawnHer === 0) taslar.push({ x: 20 + Math.random() * (W - 40), y: -16, hiz: 1.3 + Math.random() * 1.5 + skor * 0.04 });
    if (sayac % 175 === 30) { const o = ODULLER[Math.floor(Math.random() * ODULLER.length)]; oduller.push({ x: 20 + Math.random() * (W - 40), y: -16, e: o.e, t: o.t }); }
    mermiler.forEach((m) => { m.y -= 7; m.x += m.vx || 0; });
    mermiler = mermiler.filter((m) => m.y > -10 && m.x > -10 && m.x < W + 10);
    taslar.forEach((t) => (t.y += t.hiz));
    for (const t of taslar) {
      for (const m of mermiler) {
        if (!t.vur && Math.abs(m.x - t.x) < 16 && Math.abs(m.y - t.y) < 16) { t.vur = true; m.vur = true; skor++; tonCal([520]); }
      }
      if (!t.vur && t.y > H) { t.vur = true; can--; sesYanlis(); if (can <= 0) { bitti = true; return retroBitti(durak, index, "Oyun Bitti", `🚀 ${skor} göktaşı vurdun!`); } }
    }
    // düşen ödüller — gemiye değince toplanır
    oduller.forEach((o) => (o.y += 2.3));
    for (const o of oduller) {
      if (!o.al && o.y > H - 42 && Math.abs(o.x - gx) < 22) {
        o.al = true;
        if (o.t === "silah") { silah = Math.min(3, silah + 1); tonCal([700, 900, 1100]); }
        else if (o.t === "puan") { skor += 5; tonCal([1000]); }
        else { can = Math.min(5, can + 1); tonCal([600, 800]); }
      }
    }
    oduller = oduller.filter((o) => !o.al && o.y < H + 16);
    taslar = taslar.filter((t) => !t.vur && t.y < H + 20);
    mermiler = mermiler.filter((m) => !m.vur);
    ctx.fillStyle = "#0b1026"; ctx.fillRect(0, 0, W, H);
    ctx.font = "26px serif"; ctx.textAlign = "center"; ctx.textBaseline = "middle";
    taslar.forEach((t) => ctx.fillText("☄️", t.x, t.y));
    ctx.font = "20px serif"; oduller.forEach((o) => ctx.fillText(o.e, o.x, o.y));
    ctx.fillStyle = silah >= 3 ? "#f472b6" : silah === 2 ? "#fbbf24" : "#7dd3fc";
    mermiler.forEach((m) => ctx.fillRect(m.x - 2, m.y, 4, 10));
    ctx.font = "28px serif"; ctx.textAlign = "center"; ctx.textBaseline = "middle"; ctx.fillText("🚀", gx, H - 24);
    ctx.fillStyle = "#e2e8f0"; ctx.font = "bold 16px sans-serif"; ctx.textAlign = "left"; ctx.textBaseline = "alphabetic";
    ctx.fillText("Skor: " + skor + "  🔫Lv" + silah, 8, 18);
    ctx.textAlign = "right"; ctx.fillText("❤️".repeat(Math.max(0, can)), W - 8, 18);
  }
  _ara(adim, 24);
}

  const renkler = [
    { ad: "ye", renk: "#22c55e", ton: 392 },
    { ad: "kr", renk: "#ef4444", ton: 523 },

    const b = document.createElement("button");
    b.className = "simon-pad"; b.style.background = r.renk; b.dataset.ad = r.ad;
    izgara.appendChild(b); return b;
  });
  const durum = document.createElement("div");
  durum.className = "retro-skor"; durum.textContent = "Tur: 1";
  alan.appendChild(izgara); alan.appendChild(durum);

  let dizi = [], sira = 0, oyuncuSira = false, skor = 0;
  function yak(i, sure) {
    const p = padlar[i]; p.classList.add("aktif"); tonCal([renkler[i].ton]);
    _gec(() => p.classList.remove("aktif"), sure || 320);
  }
  function gosterDizi() {
    oyuncuSira = false; let k = 0;
    const araMs = Math.max(280, 640 - dizi.length * 28); // tur ilerledikçe hızlanır
    const yanma = Math.max(180, araMs - 120);
    const t = _ara(() => {
      yak(dizi[k], yanma); k++;
      if (k >= dizi.length) { clearInterval(t); _gec(() => { oyuncuSira = true; sira = 0; }, 420); }
    }, araMs);
  }
  function yeniTur() {
    dizi.push(Math.floor(Math.random() * 4));
    durum.textContent = "Tur: " + dizi.length;
    _gec(gosterDizi, 600);
  }
  padlar.forEach((p, i) => p.addEventListener("click", () => {
    if (!oyuncuSira) return;
    yak(i);
    if (i === dizi[sira]) {
      sira++;
      if (sira >= dizi.length) { skor++; oyuncuSira = false; yeniTur(); }
    } else {
      oyuncuSira = false; sesYanlis();
      retroBitti(durak, index, "Oyun Bitti", `🎵 ${dizi.length - 1} turluk diziyi hatırladın!`);
    }
  }));
  yeniTur();
}

// ---- 6) DİNO KOŞUSU (Chrome/IE çevrimdışı oyunu) ----
// Çekirdek: verilen kaba oyunu kurar, oyun bitince onEnd(skor) çağırır.
function dinoCekirdek(mount, onEnd) {
  const W = 560, H = 172, YER = H - 26; // geniş (yan) ekran, daha ferah
  const cv = document.createElement("canvas");
  cv.width = W; cv.height = H; cv.className = "retro-canvas dino-canvas";
  mount.appendChild(cv);
  const ctx = cv.getContext("2d");
  const G = 0.62, ZIP = -10.6;
  let dy = 0, vy = 0, skor = 0, bitti = false, basladi = false, sayac = 0, engeller = [];
  function ziplaYap() { if (bitti) return; if (!basladi) basladi = true; if (dy === 0) { vy = ZIP; tonCal([620]); } }
  cv.addEventListener("pointerdown", (e) => { e.preventDefault(); ziplaYap(); });
  document.onkeydown = (e) => { if (e.key === " " || e.key === "ArrowUp") { e.preventDefault(); ziplaYap(); } };
  // 🦖 emojisi sola bakar; yatay çevirip ileri (sağa, engellere) baktır
  function cizDino(y, size) {
    ctx.save(); ctx.translate(56, 0); ctx.scale(-1, 1);
    ctx.font = size + "px serif"; ctx.textAlign = "center"; ctx.textBaseline = "alphabetic";
    ctx.fillText("🦖", 0, y); ctx.restore();
  }
  function engelKoy() {
    if (skor > 30 && Math.random() < 0.26) engeller.push({ x: W + 14, y: YER - 52, w: 26, h: 22, emoji: "🦅" });
    else { const buyuk = Math.random() < 0.4; engeller.push({ x: W + 14, y: YER - (buyuk ? 34 : 24), w: buyuk ? 26 : 18, h: buyuk ? 34 : 24, emoji: "🌵" }); }
  }
  function adim() {
    if (bitti) return;
    ctx.fillStyle = "#f8fafc"; ctx.fillRect(0, 0, W, H);
    ctx.strokeStyle = "#94a3b8"; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(0, YER); ctx.lineTo(W, YER); ctx.stroke();
    if (!basladi) {
      cizDino(YER, 34);
      ctx.fillStyle = "#1e3a5f"; ctx.font = "bold 17px sans-serif"; ctx.textAlign = "center"; ctx.textBaseline = "alphabetic"; ctx.fillText("Başlamak için dokun (zıpla)", W / 2, H / 2);
      return;
    }
    sayac++;
    vy += G; dy += vy; if (dy > 0) { dy = 0; vy = 0; }
    const dinoY = YER + dy;
    if (sayac % 3 === 0) skor++;
    const hiz = 3.2 + Math.min(2.4, skor * 0.006); // ÇOK yavaş hızlanır
    const son = engeller[engeller.length - 1];
    if (!son || son.x < W - 220 - Math.random() * 150) engelKoy();
    engeller.forEach((o) => (o.x -= hiz));
    engeller = engeller.filter((o) => o.x > -40);
    const dinoBox = { x: 42, y: dinoY - 30, w: 28, h: 30 };
    for (const o of engeller) {
      ctx.font = "30px serif"; ctx.textAlign = "left"; ctx.textBaseline = "alphabetic";
      ctx.fillText(o.emoji, o.x, o.y + o.h);
      if (dinoBox.x < o.x + o.w - 6 && dinoBox.x + dinoBox.w - 6 > o.x && dinoBox.y + dinoBox.h > o.y + 6 && dinoBox.y < o.y + o.h) {
        bitti = true; sesYanlis(); return onEnd(skor);
      }
    }
    cizDino(dinoY, 34);
    ctx.fillStyle = "#1e3a5f"; ctx.font = "bold 15px sans-serif"; ctx.textAlign = "right"; ctx.textBaseline = "alphabetic"; ctx.fillText("Skor: " + skor, W - 10, 20);
  }
  _ara(adim, 24);
}

// ---- 7) TETRİS ----
function tetrisCekirdek(mount, onEnd) {
  const COLS = 10, ROWS = 16, CELL = 16, W = COLS * CELL, H = ROWS * CELL;
  const cv = document.createElement("canvas");
  cv.width = W; cv.height = H; cv.className = "retro-canvas tetris-canvas";
  mount.appendChild(cv);
  const ctx = cv.getContext("2d");
  const RENK = [null, "#22d3ee", "#fbbf24", "#a78bfa", "#4ade80", "#f87171", "#60a5fa", "#fb923c"];
  const SEKIL = {
    I: [[1, 1, 1, 1]], O: [[2, 2], [2, 2]], T: [[0, 3, 0], [3, 3, 3]],
    S: [[0, 4, 4], [4, 4, 0]], Z: [[5, 5, 0], [0, 5, 5]], J: [[6, 0, 0], [6, 6, 6]], L: [[0, 0, 7], [7, 7, 7]],
  };
  const TIPLER = Object.keys(SEKIL);
  const grid = Array.from({ length: ROWS }, () => Array(COLS).fill(0));
  let parca = null, px = 0, py = 0, skor = 0, satir = 0, bitti = false, dusHiz = 34, sayac = 0;
  function carp(m, ox, oy) {
    for (let y = 0; y < m.length; y++) for (let x = 0; x < m[y].length; x++) {
      if (m[y][x]) { const gx = ox + x, gy = oy + y; if (gx < 0 || gx >= COLS || gy >= ROWS || (gy >= 0 && grid[gy][gx])) return true; }
    }
    return false;
  }
  function dondur(m) { const R = m.length, C = m[0].length; const n = Array.from({ length: C }, () => Array(R).fill(0)); for (let y = 0; y < R; y++) for (let x = 0; x < C; x++) n[x][R - 1 - y] = m[y][x]; return n; }
  function yeni() { const t = TIPLER[Math.floor(Math.random() * TIPLER.length)]; parca = SEKIL[t].map((r) => r.slice()); px = Math.floor((COLS - parca[0].length) / 2); py = 0; if (carp(parca, px, py)) { bitti = true; onEnd(skor); } }
  function temizle() {
    let n = 0;
    for (let y = ROWS - 1; y >= 0; y--) { if (grid[y].every((c) => c)) { grid.splice(y, 1); grid.unshift(Array(COLS).fill(0)); n++; y++; } }
    if (n) { satir += n; skor += [0, 10, 30, 60, 100][n]; tonCal([600, 800]); dusHiz = Math.max(8, 34 - satir * 1.2); }
  }
  function sabitle() { for (let y = 0; y < parca.length; y++) for (let x = 0; x < parca[y].length; x++) { if (parca[y][x] && py + y >= 0) grid[py + y][px + x] = parca[y][x]; } temizle(); yeni(); }
  function dus() { if (!carp(parca, px, py + 1)) py++; else sabitle(); }
  function hareket(yon) {
    if (bitti || !parca) return;
    if (yon === "left" && !carp(parca, px - 1, py)) px--;
    else if (yon === "right" && !carp(parca, px + 1, py)) px++;
    else if (yon === "down") dus();
    else if (yon === "hard") { while (!carp(parca, px, py + 1)) py++; tonCal([300]); dus(); } // ani iniş
    else if (yon === "up") { const r = dondur(parca); if (!carp(r, px, py)) parca = r; else if (!carp(r, px - 1, py)) { parca = r; px--; } else if (!carp(r, px + 1, py)) { parca = r; px++; } }
    ciz();
  }
  function ciz() {
    ctx.fillStyle = "#0b1220"; ctx.fillRect(0, 0, W, H);
    for (let y = 0; y < ROWS; y++) for (let x = 0; x < COLS; x++) { if (grid[y][x]) { ctx.fillStyle = RENK[grid[y][x]]; ctx.fillRect(x * CELL + 1, y * CELL + 1, CELL - 2, CELL - 2); } }
    if (parca) for (let y = 0; y < parca.length; y++) for (let x = 0; x < parca[y].length; x++) { if (parca[y][x]) { ctx.fillStyle = RENK[parca[y][x]]; ctx.fillRect((px + x) * CELL + 1, (py + y) * CELL + 1, CELL - 2, CELL - 2); } }
  }
  function adim() { if (bitti) return; sayac++; if (sayac >= dusHiz) { sayac = 0; dus(); } ciz(); }
  yonTuslari(mount, hareket); // ◀ ▶ • ▲ döndür • ▼ indir
  const hd = document.createElement("button");
  hd.className = "retro-hard"; hd.textContent = "⤓ Ani İniş";
  hd.addEventListener("click", (e) => { e.preventDefault(); hareket("hard"); });
  mount.appendChild(hd);
  yeni(); ciz();
  _ara(adim, 24);
}
function retroTetris(durak, index) {
  const alan = retroKabuk("🧩 Tetris", "◀ ▶ kaydır • ▲ döndür • ▼ indir • satırları doldur!");
  tetrisCekirdek(alan, (skor) => retroBitti(durak, index, "Oyun Bitti", `🧩 Skor: ${skor}`));
}

  const mount = document.createElement("div"); mount.style.display = "flex"; mount.style.flexDirection = "column"; mount.style.alignItems = "center"; wrap.appendChild(mount);
  app.appendChild(wrap);
  tetrisCekirdek(mount, (skor) => tamamla(durak, index, skor >= 60 ? 3 : skor >= 20 ? 2 : 1, skor, 0, `🧩 Skor: ${skor}`));

}

// ---- 8) ARABA YARIŞI ----
function yarisCekirdek(mount, onEnd) {
  const W = 200, H = 320;
  const cv = document.createElement("canvas");
  cv.width = W; cv.height = H; cv.className = "retro-canvas";
  mount.appendChild(cv);
  const ctx = cv.getContext("2d");
  const RAKIP = ["🚙", "🚕", "🚚", "🚌"];
  const ENGEL = ["🚧", "🛢️", "🧱", "⚠️"];
  let cx = W / 2, skor = 0, bitti = false, basladi = false, sayac = 0, yolKay = 0, nesneler = [], suruk = false;
  function tasi(clientX) { const r = cv.getBoundingClientRect(); cx = (clientX - r.left) * (W / r.width); cx = Math.max(24, Math.min(W - 24, cx)); }
  cv.addEventListener("pointerdown", (e) => { e.preventDefault(); suruk = true; basladi = true; try { cv.setPointerCapture(e.pointerId); } catch {} tasi(e.clientX); });
  cv.addEventListener("pointermove", (e) => { if (suruk) { e.preventDefault(); tasi(e.clientX); } });
  cv.addEventListener("pointerup", () => { suruk = false; });
  cv.addEventListener("pointercancel", () => { suruk = false; });
  // Emoji sola bakar; araçları 90° döndür, geyiği yatay çevir
  function cizNesne(o, size) {
    ctx.save(); ctx.translate(o.x, o.y);
    if (o.tip === "geyik") { if (o.vx > 0) ctx.scale(-1, 1); }        // gittiği yöne baksın
    else ctx.rotate(o.aci || 0);
    ctx.font = size + "px serif"; ctx.textAlign = "center"; ctx.textBaseline = "middle";
    ctx.fillText(o.emoji, 0, 0); ctx.restore();
  }
  function uret() {
    const r = Math.random();
    if (skor > 60 && r < 0.16) { // yandan atlayan geyik
      const soldan = Math.random() < 0.5;
      nesneler.push({ x: soldan ? 8 : W - 8, y: 40 + Math.random() * 130, vx: (soldan ? 1 : -1) * (2.4 + Math.random() * 1.6), emoji: "🦌", tip: "geyik" });
    } else if (skor > 30 && r < 0.4) { // yol engeli
      nesneler.push({ x: 24 + Math.random() * (W - 48), y: -30, vx: 0, emoji: ENGEL[Math.floor(Math.random() * ENGEL.length)], tip: "engel", aci: 0 });
    } else { // araba — ileri seviyede sağa-sola kayan
      const kayan = skor > 45 && Math.random() < 0.5;
      nesneler.push({ x: 24 + Math.random() * (W - 48), y: -30, vx: kayan ? (Math.random() < 0.5 ? -1 : 1) * (0.9 + Math.random() * 1.3) : 0, emoji: RAKIP[Math.floor(Math.random() * RAKIP.length)], tip: "araba", aci: -Math.PI / 2 });
    }
  }
  function adim() {
    if (bitti) return;
    const hiz = 3 + Math.min(5, skor * 0.02);
    ctx.fillStyle = "#334155"; ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = "#a3a3a3"; ctx.fillRect(0, 0, 10, H); ctx.fillRect(W - 10, 0, 10, H);
    yolKay = (yolKay + (basladi ? hiz : 2)) % 40;
    ctx.fillStyle = "#fde047"; for (let y = -40 + yolKay; y < H; y += 40) ctx.fillRect(W / 2 - 3, y + 8, 6, 20);
    if (!basladi) {
      cizNesne({ x: cx, y: H - 40, emoji: "🚗", tip: "araba", aci: Math.PI / 2 }, 30);
      ctx.fillStyle = "#fff"; ctx.font = "bold 14px sans-serif"; ctx.textAlign = "center"; ctx.textBaseline = "middle"; ctx.fillText("Sürükleyerek başla", W / 2, H / 2);
      return;
    }
    sayac++;
    if (sayac % Math.max(22, 56 - Math.floor(skor * 0.1)) === 0) uret();
    for (const o of nesneler) {
      if (o.tip === "geyik") { o.x += o.vx; o.y += hiz * 0.25; }       // yatay koşan geyik
      else { o.y += hiz; if (o.vx) { o.x += o.vx; if (o.x < 18 || o.x > W - 18) o.vx = -o.vx; } } // kayan araç duvara çarpınca döner
    }
    nesneler = nesneler.filter((o) => o.y < H + 30 && o.x > -30 && o.x < W + 30);
    if (sayac % 2 === 0) skor++;
    for (const o of nesneler) {
      cizNesne(o, o.tip === "geyik" ? 26 : 28);
      if (Math.abs(o.x - cx) < 25 && Math.abs(o.y - (H - 40)) < 25) { bitti = true; sesYanlis(); return onEnd(skor); }
    }
    cizNesne({ x: cx, y: H - 40, emoji: "🚗", tip: "araba", aci: Math.PI / 2 }, 30); // oyuncu yukarı bakar
    ctx.fillStyle = "#fff"; ctx.font = "bold 13px sans-serif"; ctx.textAlign = "left"; ctx.textBaseline = "alphabetic"; ctx.fillText("Skor: " + skor, 14, 18);
  }
  _ara(adim, 24);
}
function retroAraba(durak, index) {
  const alan = retroKabuk("🏎️ Araba Yarışı", "Parmağınla SÜRÜKLE • diğer arabalara çarpma, hızlan!");
  yarisCekirdek(alan, (skor) => retroBitti(durak, index, "Oyun Bitti", `🏎️ Skor: ${skor}`));
}

}
